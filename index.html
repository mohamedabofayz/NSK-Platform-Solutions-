<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0F3D2E" />
  <meta name="api-endpoint" content="https://nusuk-code-tracker.mahamedabofayz.workers.dev/support" />
  <title>NSK Platform — سجّل دعمك</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ============ Header ============ -->
  <header class="site-header">
    <a href="./" class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 4 7v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V7z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong>NSK</strong>
        <small>Platform Solutions</small>
      </span>
    </a>
    <a class="header-link" href="#add-code">أضف كودك</a>
  </header>

  <!-- ============ Main ============ -->
  <main class="app">

    <!-- Card swiper -->
    <section class="swiper" aria-label="أكواد الأصدقاء">
      <div class="deck-wrap">
        <div class="deck" id="deck" aria-live="polite">
          <!-- Cards injected by app.js -->
        </div>
      </div>

      <div class="deck-actions" id="deck-actions">
        <button class="act act--skip" id="skip-btn" aria-label="تخطي الكود">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
        <button class="act act--open" id="open-btn" aria-label="فتح الرابط واستخدام الكود">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </button>
      </div>

      <p class="swipe-hint">اسحب <span class="chip chip--green">يمينًا للفتح</span> أو <span class="chip chip--red">يسارًا للتخطي</span></p>
    </section>

    <!-- Add your code -->
    <section id="add-code" class="add-code">
      <div class="add-code__head">
        <h2>أضف كودك</h2>
        <p>سجّل دعمك وشارك كودك مع بقية المجتمع</p>
      </div>

      <form id="add-form" novalidate>
        <label for="code-input" class="sr-only">كودك أو رسالة التحدي</label>
        <textarea id="code-input" rows="4" placeholder="الصق كود نسك أو رسالة التحدي هنا..." autocomplete="off" spellcheck="false"></textarea>
        <button type="submit" class="btn-submit" id="submit-btn">
          <span class="btn-label">تسجيل الدعم</span>
          <span class="btn-spinner" hidden aria-hidden="true"></span>
        </button>
        <p class="form-message" id="form-message" hidden role="status"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <span>© <span id="year"></span> NSK Platform Solutions</span>
    <span>صُنع بشغف لدعم المجتمع</span>
  </footer>

  <!-- ============ Card Templates ============ -->
  <template id="tpl-code-card">
    <article class="card" data-type="code">
      <div class="card__top">
        <span class="card__badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          كود دعم
        </span>
        <span class="card__index"></span>
      </div>

      <div class="card__body">
        <div class="card__code"></div>
        <p class="card__desc">استخدم هذا الكود لدعم صاحبه في تحدي نسك</p>
      </div>

      <div class="card__meta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <span class="card__date"></span>
      </div>

      <a class="card__cta" target="_blank" rel="noopener noreferrer">
        <span>فتح الرابط</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>
      </a>
    </article>
  </template>

  <template id="tpl-support-card">
    <article class="card card--support" data-type="support">
      <div class="support__icon">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.5 9.9v-7H8v-2.9h2.5V9.8c0-2.5 1.5-3.9 3.7-3.9 1.1 0 2.2.2 2.2.2v2.4h-1.3c-1.2 0-1.6.8-1.6 1.6v1.9H16l-.4 2.9h-2.1v7A10 10 0 0 0 22 12"/></svg>
      </div>
      <h3>تابعنا على فيسبوك</h3>
      <p>ابقَ على اطلاع بأحدث الأكواد والتحديثات. دعمك يصنع الفرق.</p>
      <a class="support__cta" target="_blank" rel="noopener noreferrer">
        متابعة الآن
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
      <p class="support__note">NSK Platform Solutions</p>
    </article>
  </template>

  <template id="tpl-empty">
    <div class="deck-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <h3>انتهت الأكواد</h3>
      <p>شكرًا لك على المرور! يمكنك إضافة كودك من الأسفل.</p>
    </div>
  </template>

  <template id="tpl-error">
    <div class="deck-empty deck-error" role="alert">
      <h3>تعذّر تحميل الأكواد</h3>
      <p>تحقق من الاتصال بالإنترنت ثم حاول مجدداً.</p>
      <button class="btn-retry" type="button">إعادة المحاولة</button>
    </div>
  </template>

  <script src="app.js" type="module"></script>
</body>
</html>
